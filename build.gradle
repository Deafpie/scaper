plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Test launcher — runs a full RuneLite client with this plugin loaded
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation 'junit:junit:4.13.2'
}

group = 'com.scaperplugin'
version = '1.0.0'

sourceCompatibility = '11'
targetCompatibility = '11'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// Launched by the Jagex Launcher via the RuneLiteDevWrapper.exe swap-in.
// Wrapper invokes: gradlew launchRuneLite "-Prl.args=<jagex --jx_session_id, etc.>"
task launchRuneLite(type: JavaExec) {
    group = 'runelite'
    description = 'Launch RuneLite with the Scaper plugin, forwarding Jagex Launcher args'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.scaperplugin.ScaperPluginTest'
    standardInput = System.in
    jvmArgs = [
        '-ea',
        '-Xmx1024m',
        '-Xss2m',
        '-XX:+UseG1GC',
        '-Dawt.useSystemAAFontSettings=on',
        '-Dswing.aatext=true',
        '-Dsun.java2d.uiScale.enabled=false',
        '-Dsun.java2d.d3d=false',
        '-Dsun.java2d.noddraw=true',
        '-Djna.nosys=true',
    ]
    doFirst {
        def raw = project.hasProperty('rl.args') ? project.property('rl.args') : ''
        if (raw?.trim()) {
            args = raw.trim().split(/\s+/) as List
        }
    }
}

// Launch RuneLite locally with this plugin sideloaded — use `./gradlew runClient`
task runClient(type: JavaExec) {
    group = 'runelite'
    description = 'Launch RuneLite with the Scaper plugin loaded for testing'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.scaperplugin.ScaperPluginTest'
    standardInput = System.in
    jvmArgs = [
        '-ea',
        '-Xmx1024m',
        '-Xss2m',
        '-XX:+UseG1GC',
        '-Dawt.useSystemAAFontSettings=on',
        '-Dswing.aatext=true',
        '-Dsun.java2d.uiScale.enabled=false',
        '-Dsun.java2d.d3d=false',
        '-Dsun.java2d.noddraw=true',
        '-Djna.nosys=true',
    ]
}
